# Namespace for the bank's application tier (payments-api and future services).
# Created by the platform team, NOT by `helm install --create-namespace`, so
# that security labels, quotas and defaults are owned centrally.
apiVersion: v1
kind: Namespace
metadata:
  name: bank-apps
  labels:
    lab.cel/zone: application
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bank-apps-quota
  namespace: bank-apps
spec:
  hard:
    pods: "12"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 1536Mi
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bank-apps-defaults
  namespace: bank-apps
spec:
  limits:
    - type: Container
      default:        { cpu: 250m, memory: 128Mi }
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      max:            { memory: 512Mi }

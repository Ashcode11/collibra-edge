# PostgreSQL "bank_core" — synthetic core-banking database.
# Reachable only inside the cluster (ClusterIP). From the Mac use:
#   kubectl --context=k3d-cel-lab -n data port-forward svc/bank-core-pg 15432:5432
apiVersion: v1
kind: Service
metadata:
  name: bank-core-pg
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: bank-core-pg
    app.kubernetes.io/part-of: bank-data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: bank-core-pg
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Headless Service: gives the StatefulSet pod a stable DNS name
# (bank-core-pg-0.bank-core-pg-hl.data.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: bank-core-pg-hl
  labels:
    app.kubernetes.io/instance: bank-core-pg
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: bank-core-pg
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bank-core-pg
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: bank-core-pg
    app.kubernetes.io/part-of: bank-data
spec:
  serviceName: bank-core-pg-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bank-core-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: bank-core-pg
        app.kubernetes.io/part-of: bank-data
        lab.cel/data-store: "true"
    spec:
      automountServiceAccountToken: false          # the database never talks to the K8s API
      terminationGracePeriodSeconds: 60            # time for a clean shutdown checkpoint
      nodeSelector:
        lab.cel/role: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                              # 'postgres' user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17.11-alpine3.24
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - shared_buffers=64MB
            - -c
            - max_connections=50
            - -c
            - password_encryption=scram-sha-256
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_statement=ddl
            - -c
            - log_min_duration_statement=1000
            - -c
            - log_line_prefix=%m [%p] user=%u db=%d app=%a client=%h
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: pg-admin, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-admin, key: password } }
            - name: POSTGRES_DB
              value: bank_core
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256 --data-checksums"
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          startupProbe:              # allows time for initdb on first boot
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "bank_core"] }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:            # "can accept connections" -> receives Service traffic
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "bank_core"] }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:             # "is the process wedged" -> restart
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/instance: bank-core-pg
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi

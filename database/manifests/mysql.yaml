# MySQL "crm" — synthetic CRM system owned by a different team.
# From the Mac: kubectl --context=k3d-cel-lab -n data port-forward svc/crm-mysql 13306:3306
apiVersion: v1
kind: Service
metadata:
  name: crm-mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: crm-mysql
    app.kubernetes.io/part-of: bank-data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: crm-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: crm-mysql-hl
  labels:
    app.kubernetes.io/instance: crm-mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: crm-mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crm-mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: crm-mysql
    app.kubernetes.io/part-of: bank-data
spec:
  serviceName: crm-mysql-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: crm-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: crm-mysql
        app.kubernetes.io/part-of: bank-data
        lab.cel/data-store: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        lab.cel/role: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                   # 'mysql' user in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: mysql:8.4.13
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-admin, key: password } }
            - name: MYSQL_DATABASE
              value: crm
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: mysql-crm-app, key: username } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-crm-app, key: password } }
          ports:
            - name: mysql
              containerPort: 3306
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          startupProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"] }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/lab.cnf
              subPath: lab.cnf
              readOnly: true
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: crm-mysql-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/instance: crm-mysql
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi

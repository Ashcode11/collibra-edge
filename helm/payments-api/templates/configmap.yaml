apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments-api.fullname" . }}
  labels: {{- include "payments-api.labels" . | nindent 4 }}
data:
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}

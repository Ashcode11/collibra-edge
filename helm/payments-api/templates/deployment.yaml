apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payments-api.fullname" . }}
  labels: {{- include "payments-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}   # omitted when the HPA owns the replica count
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below desired capacity
  selector:
    matchLabels: {{- include "payments-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "payments-api.labels" . | nindent 8 }}
      annotations:
        # config change => new checksum => rolling restart (pods pick up new values)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ include "payments-api.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "payments-api.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: {{ include "payments-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: {{ include "payments-api.fullname" . }} }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:          # DB reachable? no => taken out of the Service
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:           # process alive? no => restart (never checks the DB)
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:               # let endpoints/ingress stop sending traffic before SIGTERM
              exec: { command: ["sleep", "5"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
